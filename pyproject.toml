# Development environment for zotero-translate.
# Create or refresh the virtual environment with: uv sync
# Our code lives in src/zotero_translate; the engine under engine/ is
# installed in editable mode.

[project]
name = "zotero-translate"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["babeldoc", "httpx", "psutil", "pymupdf"]

[project.scripts]
zotero-translate = "zotero_translate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_translate"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# BabelDOC 0.6.4 imports bitstring.BitStream, which bitstring 5.0 removed.
constraint-dependencies = ["bitstring<5"]

[tool.uv.sources]
babeldoc = { path = "engine", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: calls the real pipeline model; skipped unless ZT_REAL_MODEL_SMOKE=1"]
