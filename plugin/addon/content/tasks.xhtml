<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/global.css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        id="zotero-translate-tasks" windowtype="zotero-translate:tasks"
        title="翻译任务" width="760" height="320">
  <html:style>
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #ddd; }
  </html:style>
  <script src="chrome://zotero/content/include.js"/>
  <script src="chrome://zotero-translate/content/tasks.js"/>
  <vbox flex="1" style="padding: 8px; overflow: auto;">
    <html:table>
      <html:thead>
        <html:tr><html:th>论文</html:th><html:th>阶段</html:th><html:th>进度</html:th><html:th>状态</html:th></html:tr>
      </html:thead>
      <html:tbody id="zotero-translate-rows"/>
    </html:table>
    <html:p id="zotero-translate-empty">还没有翻译任务。</html:p>
  </vbox>
</window>
